# verl config for RFT (Rejection Fine-Tuning) pre-training stage
# Supervised cross-entropy on formatted tool-call trajectories from SWE-smith.
# Think tokens are EXCLUDED from loss (§6 masking policy).
#
# Hardware target: single node, 8× A100/H100 GPUs
# Model: Qwen3-4B-Instruct-2507 with LoRA
#
# This stage must pass format quality gates before entering step-SDPO.
# Gate thresholds are in configs/runtime/phase_transition_gates.v1.json.

defaults:
  - model_defaults
  - sft_trainer
  - user
  - _self_

actor_rollout_ref:
  model:
    path: ${model_defaults.primary_name}
    enable_gradient_checkpointing: true
    use_remove_padding: true
    trust_remote_code: false
    external_lib: null
    override_config: {}
    lora:
      enable: true
      rank: 64
      alpha: 128
      target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]
      dropout: 0.05

  actor:
    strategy: fsdp2
    optim:
      lr: 5.0e-5
      lr_warmup_steps: 50
      weight_decay: 0.01
      lr_scheduler_type: cosine

    grad_clip: 1.0

    fsdp_config:
      dtype: bfloat16
      fsdp_size: 8
      model_dtype: bf16
      forward_prefetch: true
      offload_policy: false
      reshard_after_forward: true
      wrap_policy:
        min_num_params: 0

    use_remove_padding: true

  rollout:
    name: vllm
    tensor_model_parallel_size: 2
    data_parallel_size: 4
    gpu_memory_utilization: 0.9
    enforce_eager: true
    free_cache_engine: true
    max_num_seqs: 64
    max_num_batched_tokens: 262144

# Maximum sequence length for RFT data (shorter than SDPO — no reprompt overhead)
max_model_len: 12288

model:
  partial_pretrain: ${model_defaults.primary_name}

data:
  train_batch_size: 64
  micro_batch_size_per_gpu: 1
  max_length: 12288
  train_files: /tmp/onpolicy-rft-train.parquet
  val_files: /tmp/onpolicy-rft-val.parquet
  custom_cls:
    path: pkg://verl_integration.onpolicy_rft_dataset
    name: OnPolicyRFTDataset
  on_policy:
    enabled: true
    data_config_name: on_policy_swe_smith
    turn_generator_mode: default
    total_steps: 1
    output_dir: null
    runtime_overrides: {}
    data_overrides: {}
    rft_handoff_overrides: {}

trainer:
  save_freq: 200
  test_freq: -1
  total_epochs: 3
  group_name: small-swe-rft
