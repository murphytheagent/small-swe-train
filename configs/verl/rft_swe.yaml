# verl config for RFT (Rejection Fine-Tuning) pre-training stage
# Supervised cross-entropy on formatted tool-call trajectories from SWE-smith.
# Think tokens are EXCLUDED from loss (§6 masking policy).
#
# Hardware target: single node, variable GPU count
# Model: Qwen3-4B-Instruct-2507 with LoRA
#
# This stage must pass format quality gates before entering step-SDPO.
# Gate thresholds are in configs/runtime/phase_transition_gates.v1.json.

defaults:
  - model_defaults
  - sft_trainer
  - _self_

actor_rollout_ref:
  model:
    enable_gradient_checkpointing: true
    use_remove_padding: true
    trust_remote_code: false
    external_lib: null
    override_config: {}
    # Mirror LoRA knobs into legacy HFModelConfig fields consumed by verl.
    lora_rank: 16
    lora_alpha: 32
    # Keep model.target_modules aligned with attn + MLP LoRA default modules.
    target_modules: ".*(q_proj|k_proj|v_proj|o_proj|gate_proj|up_proj|down_proj)$"
    lora:
      enable: true
      rank: 16
      alpha: 32
      target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
      dropout: 0.05

  actor:
    strategy: fsdp2
    optim:
      lr: 5.0e-6
      lr_warmup_steps: 5
      weight_decay: 0.01
      lr_scheduler_type: constant_with_warmup

    grad_clip: 1.0

    fsdp_config:
      forward_prefetch: true
      offload_policy: false
      reshard_after_forward: true
      wrap_policy:
        min_num_params: 0

    use_remove_padding: true
# the rollout section will be completely ignored in our control flow
# this section is only here for compatibility with verl SFT trainer config
  rollout:
    name: vllm
    gpu_memory_utilization: 0.8
    enforce_eager: true
    free_cache_engine: true
    max_num_seqs: 64
    max_num_batched_tokens: 262144

# RFT token budget per packed training row.
# This is consumed by data.max_length and by run_rft.sh overrides.
max_model_len: 16384

data:
  micro_batch_size_per_gpu: 2
  # SFT row truncation/padding length.
  max_length: ${max_model_len}
  apply_chat_template_kwargs: {}
  train_files: /tmp/onpolicy-rft-train.parquet
  val_files: /tmp/onpolicy-rft-val.parquet
  custom_cls:
    path: pkg://verl_integration.onpolicy_rft_dataset
    name: OnPolicyRFTDataset
  on_policy:
    enabled: true
    data_config_name: on_policy_swe_smith
    turn_generator_mode: default
    output_dir: null

trainer:
  project_name: small-swe-rft
  experiment_name: ${oc.env:EXPERIMENT,rft}
  default_local_dir: ${oc.env:PROJECT_ROOT,${oc.env:PWD,.}}/outputs/rft_runtime/${trainer.experiment_name}
  save_freq: 100
  test_freq: 5
  group_name: small-swe-rft
