[build-system]
requires = ["setuptools>=80.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "small-swe-train"
version = "0.1.0"
description = "Scaffold for chat-style SWE training contracts and SDPO plumbing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
]
train = [
  "torch>=2.9.1,<2.10",
  "transformers>=4.57.3",
  "flash-attn>=2.8.3",
  "orjson>=3.10",
  "peft>=0.18",
  "vllm>=0.8.4",
  "datasets>=4.4.2",
  "ray>=2.40",
  "verl @ git+https://github.com/lasgroup/SDPO.git@c52586ba45633a817879f59e2612cc62c55c8479",
  "omegaconf>=2.3",
  "hydra-core>=1.3",
  "wandb>=0.23.1",
  "ninja>=1.13.0",
  "packaging>=24.0",
  "setuptools>=80.0",
  "wheel>=0.46.0",
  "qwen-vl-utils>=0.0.14",
]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = [
  "config",
  "qwen_vl_utils",
  "runtime_paths",
  "sitecustomize",
  "small_swe_runtime_patches",
  "verifier_utils",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"prompts.model_configs" = ["*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

# --- New uv configuration ---
[tool.uv]
package = true

[tool.uv.extra-build-dependencies]
# Keep uv's isolated flash-attn builds on the same torch ABI series as runtime deps.
flash-attn = ["torch>=2.9.1,<2.10", "setuptools>=80.0", "wheel>=0.46.0", "packaging>=24.0", "ninja>=1.13.0"]
