[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "small-swe-train"
version = "0.1.0"
description = "Scaffold for chat-style SWE training contracts and SDPO plumbing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
]
train = [
  "torch>=2.5.1",
  "transformers>=4.46",
  "flash-attn>=2.7",
  "peft>=0.13",
  "vllm>=0.8.4",
  "ray>=2.40",
  "omegaconf>=2.3",
  "hydra-core>=1.3",
  "wandb>=0.19",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"prompts.model_configs" = ["*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
